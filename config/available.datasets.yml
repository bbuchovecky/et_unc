# All available datasets in this workflow
prep:
  # For prep_<family>.py: products, models and members of each family
  #
  # Products of obs and lsmobs, one mapping per variable: {label: {dataset, version, variable, freq, source}}
  #   source: ilamb   an ILAMB product, read by il.load_native: the label is its key in il.PRODUCTS[variable],
  #                   and dataset/version/variable/freq only describe it
  #   source: native  read from its native files: lo.load_obs(dataset, variable, version=, freq=), except the
  #                   datasets era5-land (le.load_era5_land, variable only) and era5 (le.load_native, GDEX code)
  # Every combination of one product per variable (et, lai, pr, rn) is one source.
  obs:
    et_products:
      # native products
      PMLv2.2a_MODIS: {dataset: pml, version: V2.2a-MODIS, variable: ET, freq: monthly, source: native}
      PMLv2.2b:       {dataset: pml, version: V2.2b, variable: ET, freq: monthly, source: native}
      PMLv2.2c:       {dataset: pml, version: V2.2c, variable: ET, freq: monthly, source: native}
      GLEAMv4.3a:     {dataset: gleam, version: v4.3a, variable: E, freq: monthly, source: native}
      GLEAMv4.3b:     {dataset: gleam, version: v4.3b, variable: E, freq: monthly, source: native}
      SiTHv2:         {dataset: sith, version: v2, variable: ET, freq: monthly, source: native}
      FLUXCOM-X-BASE: {dataset: fluxcom-x, version: X-BASE, variable: ET, freq: monthly, source: native}
      # ILAMB products
      FLUXCOM:        {dataset: fluxcom, version: null, variable: et, freq: monthly, source: ilamb}
      CLASS:          {dataset: class, version: null, variable: et, freq: monthly, source: ilamb}
      DOLCE:          {dataset: dolce, version: null, variable: et, freq: monthly, source: ilamb}
      MOD16A2:        {dataset: mod16a2, version: null, variable: et, freq: monthly, source: ilamb}
      MODIS:          {dataset: modis, version: null, variable: et, freq: monthly, source: ilamb}
      WECANN:         {dataset: wecann, version: null, variable: et, freq: monthly, source: ilamb}
    lai_products:
      # native products
      GIMMS_LAI4g_V1.2:       {dataset: gimms-lai4g, version: V1.2, variable: lai, freq: half-month, source: native}
      GIMMS_LAI4g-AVHRR_V1.2: {dataset: gimms-lai4g-avhrr, version: V1.2, variable: lai, freq: half-month, source: native}
      AVHRRv5_obs4MIPs:       {dataset: avhrr, version: v20260110, variable: lai, freq: monthly, source: native}  # ends 2013-12
      VIIRSv1_obs4MIPs:       {dataset: viirs, version: v20260110, variable: lai, freq: monthly, source: native}  # starts 2014-01
      HiQ-LAIv1:              {dataset: hiq-lai, version: v1, variable: lai, freq: 8-day, source: native}
      # ILAMB products
      GIMMS_LAI4g: {dataset: gimms-lai4g, version: V1.2, variable: lai, freq: monthly, source: ilamb}
      AVH15C1:     {dataset: avh15c1, version: null, variable: lai, freq: monthly, source: ilamb}
      AVHRR:       {dataset: avhrr, version: null, variable: lai, freq: monthly, source: ilamb}
      MODIS:       {dataset: modis, version: null, variable: lai, freq: monthly, source: ilamb}
    pr_products:
      # native products
      GPCPv3.3: {dataset: gpcp, version: "3.3", variable: sat_gauge_precip, freq: monthly, source: native}
      GPCPv3.2: {dataset: gpcp, version: "3.2", variable: sat_gauge_precip, freq: monthly, source: native}
      # ILAMB products
      CLASS:     {dataset: class, version: null, variable: pr, freq: monthly, source: ilamb}
      CMAPv1904: {dataset: cmap, version: v1904, variable: pr, freq: monthly, source: ilamb}
      GPCCv2018: {dataset: gpcc, version: v2018, variable: pr, freq: monthly, source: ilamb}
      GPCPv2.3:  {dataset: gpcp, version: "2.3", variable: pr, freq: monthly, source: ilamb}
    rn_products:
      # native products
      CLARA-A3:   {dataset: clara, version: A3, variable: SRB, freq: monthly, source: native}  # shortwave missing in low-sun months
      # ILAMB products
      CERESed4.2: {dataset: ceres, version: ed4.2, variable: rns, freq: monthly, source: ilamb}
      CLASS:      {dataset: class, version: null, variable: rns, freq: monthly, source: ilamb}
      GEWEX.SRB:  {dataset: gewex-srb, version: null, variable: rns, freq: monthly, source: ilamb}
  # Land-model / reanalysis ET products (prep_lsmobs.py). lai/pr/rn_products: null = each ET product's
  # own field (prep_lsmobs.OWN_FIELDS), or products as in obs, combined with every ET product
  lsmobs:
    et_products:
      ERA5:              {dataset: era5, version: null, variable: mer, freq: monthly, source: native}
      ERA5-Land:         {dataset: era5-land, version: null, variable: e, freq: monthly, source: native}
      GLDAS2.0-Noah:     {dataset: gldas, version: "2.0", variable: Evap_tavg, freq: monthly, source: native}
      GLDAS2.1-Noah:     {dataset: gldas, version: "2.1", variable: Evap_tavg, freq: monthly, source: native}
  cmip:
    source_ids: [
      ACCESS-ESM1-5,
      AWI-ESM-1-1-LR,
      BCC-ESM1,
      CESM2,
      CESM2-FV2,
      CESM2-WACCM,
      CESM2-WACCM-FV2,
      CMCC-CM2-SR5,
      CMCC-ESM2,
      CNRM-CM6-1,
      CNRM-CM6-1-HR,
      CNRM-ESM2-1,
      CanESM5,
      CanESM5-1,
      CanESM5-CanOE,
      E3SM-1-0,
      E3SM-1-1,
      E3SM-1-1-ECA,
      E3SM-2-0,
      E3SM-2-0-NARRM,
      E3SM-2-1,
      EC-Earth3-Veg,
      EC-Earth3-Veg-LR,
      FGOALS-g3,
      GFDL-ESM4,
      GISS-E2-1-G,
      GISS-E2-1-G-CC,
      GISS-E2-1-H,
      GISS-E2-2-G,
      GISS-E3-G,
      HadGEM3-GC31-LL,
      HadGEM3-GC31-MM,
      INM-CM4-8,
      INM-CM5-0,
      IPSL-CM6A-LR,
      MIROC-ES2L,
      MPI-ESM-1-2-HAM,
      MPI-ESM1-2-HR,
      MPI-ESM1-2-LR,
      NorESM2-LM,
      NorESM2-MM,
      SAM0-UNICON,
      TaiESM1,
      UKESM1-0-LL,
    ]